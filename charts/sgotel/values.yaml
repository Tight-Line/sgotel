replicaCount: 1

image:
  repository: ghcr.io/tight-line/sgotel
  pullPolicy: IfNotPresent
  tag: ""  # defaults to .Chart.AppVersion

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# ==============================================================================
# SGOtel runtime knobs (rendered into a ConfigMap as SGOTEL_* env vars).
# ==============================================================================
sgotel:
  listenAddr: ":8080"
  webhookPath: "/webhook"
  signatureMaxAge: "5m"      # Replay-window check on the signed timestamp; "0" disables.
  redactEmail: "none"        # one of: none, hash, drop
  queueSize: 1024            # Buffered channel between handler and publisher.
  queueFullBehavior: "block" # block (wait for room) or shed (return 503)
  maxBodyBytes: 5242880      # Max request body (bytes); larger POSTs get 413 before verification. 5 MiB.
  enqueueTimeout: "5s"       # block mode: wait this long for queue space, then shed with 503. "0" waits forever.

# ==============================================================================
# SendGrid Signed Event Webhook public key (base64 PKIX DER from SendGrid UI).
# Provide via `sendgridPublicKey` (rendered into a Secret) OR `existingSecret`
# pointing at a Secret that already contains SGOTEL_SENDGRID_PUBLIC_KEY.
# ==============================================================================
sendgridPublicKey: ""
existingSecret: ""

# ==============================================================================
# OTLP exporter configuration. All standard OTel env vars are honored.
# Put authentication headers (Bearer tokens, x-honeycomb-team, etc.) in
# `otlp.headers` so they end up in the Secret, not the ConfigMap.
# ==============================================================================
otlp:
  endpoint: ""               # e.g. https://api.honeycomb.io
  protocol: "http/protobuf"  # one of: http/protobuf, grpc
  # Free-form key=value pairs joined with commas, e.g.
  #   "x-honeycomb-team=YOUR_KEY"
  headers: ""

# OTEL_SERVICE_NAME — identifies the relay process. All signals additionally
# carry the resource attribute messaging.system=sendgrid.
serviceName: "sgotel"

# ==============================================================================
# Extra OTel resource attributes (merged into OTEL_RESOURCE_ATTRIBUTES env).
#
# The standard way to distinguish per-environment instances (dev/qa/stage/prod)
# is `deployment.environment.name` — most observability backends auto-facet on
# it. `service.namespace` groups related services together in service-list views.
#
# Keep keys/values simple (alphanumeric, dots, dashes, underscores). Values
# containing commas, equals signs, or non-ASCII characters need URL-encoding
# per the OTel env-var spec, which this chart does not do for you.
# ==============================================================================
resourceAttributes: {}
  # deployment.environment.name: prod    # one of dev / qa / stage / prod
  # service.namespace: tightline
  # region: us-east-1

# ==============================================================================
# Service / pod settings.
# ==============================================================================
service:
  type: ClusterIP
  port: 80
  annotations: {}

# ==============================================================================
# Ingress: expose sgotel via a Kubernetes Ingress.
#
# Leave disabled when fronting sgotel with a LoadBalancer Service, a Gateway
# API HTTPRoute, or another webhook proxy (e.g. gatekeeper).
#
# When enabled, both `className` and `host` are required; the chart fails
# rendering otherwise so you don't get a silently-broken default.
#
# TLS termination is most commonly handled by the ingress controller (set
# tls.enabled and either let cert-manager issue a cert via annotations, or
# point tls.secretName at an existing Secret). If a load balancer in front
# of the ingress already terminates TLS, leave tls.enabled=false.
# ==============================================================================
ingress:
  enabled: false
  className: ""              # required when enabled, e.g. "nginx", "traefik"
  host: ""                   # required when enabled, e.g. "sendgrid-webhooks.example.com"
  path: "/webhook"
  pathType: "Prefix"
  annotations: {}
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
  tls:
    enabled: false
    secretName: ""           # use with cert-manager (the issuer creates this Secret) or pre-provisioned

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

nodeSelector: {}
tolerations: []
affinity: {}
