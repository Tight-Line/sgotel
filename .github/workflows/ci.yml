name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Run tests and check coverage
        run: ./scripts/check-coverage.sh --codecov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.filtered.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Via make so CI and a contributor's machine run the same pinned linter,
      # built by the toolchain the `go` directive selects.
      - name: Run golangci-lint
        run: make lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build binary
        run: CGO_ENABLED=0 go build -o bin/sgotel ./cmd/sgotel

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: sgotel
          path: bin/

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Reports standard-library advisories against the toolchain the `go`
      # directive selects, so a stale directive surfaces here rather than
      # sitting unnoticed until someone runs a scanner by hand.
      - name: Run govulncheck
        run: make vulncheck
